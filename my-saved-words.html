<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Saved Words</title>
  <link rel="stylesheet" href="css/site.css" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <div id="sidebarToggle" onclick="toggleSidebar()">☰</div>

  <!-- Sidebar Navigation -->
  <nav id="sidebar">
    <ul>
      <li><a href="index.html">🏠 Home</a></li>
      <li><a href="index.html">Verbs</a></li>
      <li>
        <button class="dropdown-btn">Adjectives ▼</button>
        <div class="dropdown-content">
          <a href="i-adjectives.html">i-Adjectives</a>
          <!-- <a href="naadjectives.html">na-Adjectives</a> -->
        </div>
      </li>
      <li id="accountSection">
        <span id="accountGuestView">
          <a href="#" id="loginLink">🔐 Log In / Sign Up</a>
        </span>
        <span id="accountUserView" style="display: none;">
          <span id="accountEmailLabel"></span>
          <a href="my-saved-words.html">⭐ My Saved Words</a>
          <a href="my-vocab.html">📝 My Vocab</a>
          <a href="#" id="logoutLink">🚪 Log Out</a>
        </span>
      </li>
    </ul>
  </nav>

  <!-- Login / Sign Up Modal -->
  <div id="authModal" class="auth-modal">
    <div class="auth-modal-content">
      <button id="authModalClose" class="auth-modal-close" aria-label="Close">&times;</button>
      <h2 id="authModalTitle">Log In</h2>
      <form id="authForm">
        <input type="email" id="authEmail" placeholder="Email" autocomplete="email" required />
        <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password" required />
        <div id="authError" class="auth-error"></div>
        <button type="submit" id="authSubmitBtn">Log In</button>
      </form>
      <div class="auth-divider">or</div>
      <button type="button" id="googleLoginBtn" class="oauth-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </button>
      <p>
        <span id="authToggleText">Don't have an account?</span>
        <a href="#" id="authToggleLink">Sign Up</a>
      </p>
    </div>
  </div>

  <h1>My Saved Words</h1>

  <p id="guestNotice" style="display: none; text-align: center;">
    Please <a href="#" id="guestLoginLink">log in</a> to see your saved words.
  </p>

  <table id="savedWordsTable" style="display: none;">
    <thead>
      <tr>
        <th style="width: 10%;">Hiragana</th>
        <th style="width: 10%;">Kanji</th>
        <th style="width: 13%;">English</th>
        <th style="width: 26%;">Example</th>
        <th style="width: 14%;">Translation</th>
        <th style="width: 10%;">Type</th>
        <th style="width: 8.5%;">Play</th>
        <th style="width: 8.5%;">Play Example</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <audio id="audioPlayer" class="audio-player" controls></audio>

  <script src="js/vocab-page.js"></script>
  <script src="js/audio-player.js"></script>
  <script src="js/sidebar-nav.js"></script>
  <script type="module" src="js/auth-ui.js"></script>
  <script src="js/my-saved-words.js"></script>
</body>
</html>
