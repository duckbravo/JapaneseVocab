<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Vocab</title>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <div id="sidebarToggle" onclick="toggleSidebar()">☰</div>

  <!-- Sidebar Navigation -->
  <nav id="sidebar">
    <ul>
      <li><a href="index.html">🏠 Home</a></li>
      <li><a href="index.html">Verbs</a></li>
      <li>
        <button class="dropdown-btn">Adjectives ▼</button>
        <div class="dropdown-content">
          <a href="i-adjectives.html">i-Adjectives</a>
          <!-- <a href="naadjectives.html">na-Adjectives</a> -->
        </div>
      </li>
      <li id="accountSection">
        <span id="accountGuestView">
          <a href="#" id="loginLink">🔐 Log In / Sign Up</a>
        </span>
        <span id="accountUserView" style="display: none;">
          <span id="accountEmailLabel"></span>
          <a href="my-saved-words.html">⭐ My Saved Words</a>
          <a href="my-vocab.html">📝 My Vocab</a>
          <a href="#" id="logoutLink">🚪 Log Out</a>
        </span>
      </li>
    </ul>
  </nav>

  <!-- Login / Sign Up Modal -->
  <div id="authModal" class="auth-modal">
    <div class="auth-modal-content">
      <button id="authModalClose" class="auth-modal-close" aria-label="Close">&times;</button>
      <h2 id="authModalTitle">Log In</h2>
      <form id="authForm">
        <input type="email" id="authEmail" placeholder="Email" autocomplete="email" required />
        <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password" required />
        <div id="authError" class="auth-error"></div>
        <button type="submit" id="authSubmitBtn">Log In</button>
      </form>
      <p>
        <span id="authToggleText">Don't have an account?</span>
        <a href="#" id="authToggleLink">Sign Up</a>
      </p>
    </div>
  </div>

  <h1>My Vocab</h1>

  <p id="guestNotice" style="display: none; text-align: center;">
    Please <a href="#" id="guestLoginLink">log in</a> to create and manage your own vocab words.
  </p>

  <form id="customVocabForm" class="vocab-form" style="display: none;">
    <h2 id="formTitle">Add a word</h2>

    <label for="customHiragana">
      Hiragana
      <input type="text" id="customHiragana" required />
    </label>

    <label for="customKanji">
      Kanji <small>(optional)</small>
      <input type="text" id="customKanji" />
    </label>

    <label for="customEnglish">
      English
      <input type="text" id="customEnglish" required />
    </label>

    <label for="customExample">
      Example sentence <small>(bracket syntax, e.g. 食べる[たべる]をたべます)</small>
      <textarea id="customExample" rows="2"></textarea>
    </label>
    <div id="examplePreview" class="furigana-preview"></div>

    <label for="customTranslation">
      Translation
      <input type="text" id="customTranslation" />
    </label>

    <label for="customNotes">
      Notes <small>(optional, same bracket syntax)</small>
      <textarea id="customNotes" rows="2"></textarea>
    </label>
    <div id="notesPreview" class="furigana-preview"></div>

    <div id="formError" class="auth-error"></div>

    <div class="vocab-form-actions">
      <button type="submit" id="formSubmitBtn">Add</button>
      <button type="button" id="cancelEditBtn" style="display: none;">Cancel</button>
    </div>
  </form>

  <table id="customVocabTable" style="display: none;">
    <thead>
      <tr>
        <th style="width: 12%;">Hiragana</th>
        <th style="width: 12%;">Kanji</th>
        <th style="width: 15%;">English</th>
        <th style="width: 30%;">Example</th>
        <th style="width: 16%;">Translation</th>
        <th style="width: 15%;">Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="js/vocab-page.js"></script>
  <script src="js/sidebar-nav.js"></script>
  <script type="module" src="js/auth-ui.js"></script>
  <script src="js/saved-words.js"></script>
  <script src="js/custom-vocab.js"></script>
</body>
</html>
