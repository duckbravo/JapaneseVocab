<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Japanese Vocabulary</title>
  <link rel="stylesheet" href="css/site.css" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <div id="sidebarToggle" onclick="toggleSidebar()">☰</div>

  <!-- Sidebar Navigation -->
  <nav id="sidebar">
    <ul>
      <li><a href="index.html">🏠 Home</a></li>
      <li><a href="index.html">Verbs</a></li>
      <li>
        <button class="dropdown-btn">Adjectives ▼</button>
        <div class="dropdown-content">
          <a href="i-adjectives.html">i-Adjectives</a>
          <!-- <a href="naadjectives.html">na-Adjectives</a> -->
        </div>
      </li>
      <li id="accountSection">
        <span id="accountGuestView">
          <a href="#" id="loginLink">🔐 Log In / Sign Up</a>
        </span>
        <span id="accountUserView" style="display: none;">
          <span id="accountEmailLabel"></span>
          <a href="my-saved-words.html">⭐ My Saved Words</a>
          <a href="my-vocab.html">📝 My Vocab</a>
          <a href="#" id="logoutLink">🚪 Log Out</a>
        </span>
      </li>
    </ul>
  </nav>

  <!-- Login / Sign Up Modal -->
  <div id="authModal" class="auth-modal">
    <div class="auth-modal-content">
      <button id="authModalClose" class="auth-modal-close" aria-label="Close">&times;</button>
      <h2 id="authModalTitle">Log In</h2>
      <form id="authForm">
        <input type="email" id="authEmail" placeholder="Email" autocomplete="email" required />
        <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password" required />
        <div id="authError" class="auth-error"></div>
        <button type="submit" id="authSubmitBtn">Log In</button>
      </form>
      <p>
        <span id="authToggleText">Don't have an account?</span>
        <a href="#" id="authToggleLink">Sign Up</a>
      </p>
    </div>
  </div>

  <!-- Your main content goes here -->
  <div class="main-content">
    <h1>Verbs</h1>
    <!-- Table or other content -->
  </div>

  <h1>Japanese Vocabulary</h1>
  <div style="display: flex; justify-content: start; align-items: center; gap: 10px; margin-bottom: 1em;">
    <button onclick="shuffleTable()">🔀 Shuffle</button>
    <button onclick="startSequentialPlay()">▶ Play All</button>
    <button id="pauseResumeBtn" onclick="pauseOrResume()">⏸ Pause</button>
    <button onclick="stopSequentialPlay()">⏹ Stop</button>
    <button onclick="resetTable()">🔄 Default</button>
    <label for="rowsPerPageSelect">Rows per page:</label>
    <select id="rowsPerPageSelect" onchange="changeRowsPerPage(this.value)">
      <option value="10">10</option>
      <option value="20" selected>20</option>
      <option value="50">50</option>
    </select>
  </div>

  <table id="vocabTable">
    <thead>
      <tr>
        <th style="width: 9%;">Hiragana</th>
        <th style="width: 9%;">Kanji</th>
        <th style="width: 11%;">English</th>
        <th style="width: 23%;">Example</th>
        <th style="width: 13%;">Translation</th>
        <th style="width: 13%;">More</th>
        <th style="width: 11%;">Play</th>
        <th style="width: 11%;">Play Example</th>

      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="paginationControls" style="display: flex; justify-content: center; gap: 5px; margin-top: 1em;"></div>

  <audio id="audioPlayer" class="audio-player" controls></audio>

  <script src="js/vocab-page.js"></script>
  <script src="js/csv-vocab.js"></script>
  <script src="js/audio-player.js"></script>
  <script src="js/sidebar-nav.js"></script>
  <script type="module" src="js/auth-ui.js"></script>
  <script src="js/saved-words.js"></script>
  <script>
    initVocabPage({ csv: "verb_ready_final.csv", soundDir: "verb_sound", hasMore: true, wordType: "verb" });
  </script>
</body>
</html>
