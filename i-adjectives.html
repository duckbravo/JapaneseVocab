<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Japanese I-adjective</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/site.css" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <div id="sidebarToggle" onclick="toggleSidebar()">☰</div>

  <!-- Sidebar Navigation -->
  <nav id="sidebar">
    <ul>
      <li><a href="index.html">🏠 Home</a></li>
      <li><a href="index.html">Verbs</a></li>
      <li>
        <button class="dropdown-btn">Adjectives ▼</button>
        <div class="dropdown-content">
          <a href="i-adjectives.html">i-Adjectives</a>
          <!-- <a href="naadjectives.html">na-Adjectives</a> -->
        </div>
      </li>
      <!-- Account links are injected by js/auth-ui.js — don't add markup here. -->
      <li id="accountSection"></li>
    </ul>
  </nav>

  <!-- Your main content goes here -->
  <div class="main-content">
    <h1>i-Adjectives</h1>
    <!-- Table or other content -->
  </div>

  <h1>Japanese Vocabulary</h1>
  <div class="vocab-toolbar">
    <button onclick="shuffleTable()">🔀 Shuffle</button>
    <button onclick="startSequentialPlay()">▶ Play All</button>
    <button id="pauseResumeBtn" onclick="pauseOrResume()">⏸ Pause</button>
    <button onclick="stopSequentialPlay()">⏹ Stop</button>
    <button onclick="resetTable()">🔄 Default</button>
    <button id="expandAllBtn" type="button">⊞ Expand all</button>
    <label for="rowsPerPageSelect">Rows per page:</label>
    <select id="rowsPerPageSelect" onchange="changeRowsPerPage(this.value)">
      <option value="10">10</option>
      <option value="20" selected>20</option>
      <option value="50">50</option>
    </select>
  </div>

  <!-- Cards are built by js/vocab-cards.js; the header row only shows on
       wide screens, where the cards line up like table columns. -->
  <div id="vocabTable" class="vocab-cards">
    <div class="vocab-list-header" aria-hidden="true">
      <span>Hiragana</span><span>Kanji</span><span>English</span><span></span>
    </div>
    <div class="vocab-list"></div>
  </div>

  <div id="paginationControls" style="display: flex; justify-content: center; gap: 5px; margin-top: 1em;"></div>

  <audio id="audioPlayer" class="audio-player" controls></audio>

  <script src="js/vocab-page.js"></script>
  <script src="js/vocab-cards.js"></script>
  <script src="js/csv-vocab.js"></script>
  <script src="js/audio-player.js"></script>
  <script src="js/sidebar-nav.js"></script>
  <script type="module" src="js/auth-ui.js"></script>
  <script src="js/saved-words.js"></script>
  <script>
    initVocabPage({ csv: "iadjective_ready_final.csv", soundDir: "iadjective_sound", hasMore: false, wordType: "i-adjective" });
  </script>
</body>
</html>
